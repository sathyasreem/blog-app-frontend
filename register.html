<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Register</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h2>My Blog</h2>
  <nav><a href="index.html">Home</a><a href="login.html">Login</a><a href="register.html">Register</a></nav>
</header>
<div class="container"><div class="card">
  <h2 style="text-align:center;margin-bottom:16px">Register</h2>
  <form onsubmit="register(event)">
    <input id="name" type="text" placeholder="Name" required>
    <input id="email" type="email" placeholder="Email" required>
    <input id="password" type="password" placeholder="Password" minlength="6" required>
    <button type="submit">Create Account</button>
  </form>
</div></div>
<script src="script.js"></script>
</body>
</html>
